<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RippleMesh - Emergency Disaster Mesh</title>
  <link rel="stylesheet" href="/ui-static/style.css">
  <style>
    .landing-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .landing-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--shadow-md);
    }
    .landing-logo {
      font-size: 54px;
      margin-bottom: 12px;
    }
    .landing-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .landing-desc {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .portal-options {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .btn-portal {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: 700;
      border-radius: var(--radius-md);
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-portal:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .btn-citizen {
      background: var(--danger);
      color: #ffffff;
    }
    .btn-citizen:hover {
      background: #b91c1c;
    }
    .btn-coordinator {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-coordinator:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="landing-wrapper">
    <div class="landing-card">
      <div class="landing-logo">🌊</div>
      <h1 class="landing-title">RippleMesh</h1>
      <p class="landing-desc">
        Decentralized mesh emergency intelligence & disaster response platform. 
        Select your portal below:
      </p>

      <div class="portal-options">
        <a href="/citizen/" class="btn-portal btn-citizen">
          📢 Report an emergency
        </a>
        <a href="/coordinator/" class="btn-portal btn-coordinator">
          🛡️ Control room login
        </a>
      </div>
    </div>
  </div>
</body>
</html>
